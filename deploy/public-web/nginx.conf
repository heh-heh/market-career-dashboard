# Public read-only site behind an existing HTTPS Tailscale Funnel.
# ONLY loopback is bound; never attach this to admin/SSH/Portainer.
server {
    listen 127.0.0.1:18086;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 1k;
    access_log off;

    # Upstream is the existing isolated DASHBOARD_ONLY API. The strict
    # allowlist prevents routing arbitrary API or admin endpoints.
    location ~ ^/api/(health|dashboard|server-telemetry|quotes|realtime|stocks|indices|news|jobs|employment)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:18084";
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location ^~ /api/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
}
