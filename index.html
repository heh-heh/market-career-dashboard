<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market & Career Dashboard</title>
<style>
:root{--bg:#080d18;--panel:#111a2c;--line:#263553;--text:#eef3ff;--muted:#91a0bb;--accent:#7c8cff;--up:#43d17d;--down:#ff647c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#182447,#080d18 45%);color:var(--text);font-family:system-ui,"Noto Sans KR",sans-serif}.app{max-width:1180px;margin:auto;padding:24px 16px 50px}
header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}h1{margin:0;font-size:30px}.sub,.muted{color:var(--muted)}.date{text-align:right;font-size:12px;color:var(--muted)}
nav{display:flex;gap:8px;overflow:auto;margin-bottom:20px}button{border:1px solid var(--line);background:#0e1627;color:var(--muted);padding:11px 15px;border-radius:11px;cursor:pointer;white-space:nowrap}button.active{background:var(--accent);color:white}
.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.card{background:#111a2cf0;border:1px solid var(--line);border-radius:16px;padding:17px}.label{font-size:12px;color:var(--muted)}.big{font-size:24px;font-weight:800;margin:7px 0}.up{color:var(--up)}.down{color:var(--down)}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.stock-click{cursor:pointer}.stock-click:hover{background:#18233b}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}.modal.open{display:flex;align-items:center;justify-content:center}.modal-box{width:100%;max-width:760px;max-height:calc(100dvh - 24px);overflow-y:auto;background:#111a2c;border:1px solid var(--line);border-radius:18px;padding:18px;position:relative}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.modal-close{font-size:20px;padding:5px 10px}.forecast{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.forecast-card{background:#0d1627;border:1px solid var(--line);border-radius:12px;padding:15px}.forecast-price{font-size:20px;font-weight:800;margin:8px 0}.mini{font-size:12px;color:var(--muted);line-height:1.7}@media(max-width:600px){.forecast{grid-template-columns:1fr}.modal{padding:8px}.modal-box{max-height:calc(100dvh - 16px);padding:15px;border-radius:14px}.modal-head h2{font-size:20px;margin:5px 0}.modal-close{min-width:44px;min-height:44px}.forecast-price{font-size:18px}}.item h3{font-size:14px;margin:0 0 6px}.item p{font-size:13px;line-height:1.65;color:#c6d0e4;margin:0}.tag{display:inline-block;background:#202c49;border-radius:999px;padding:5px 8px;font-size:11px;margin:4px}.chart-card{margin-top:14px}.chart-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.chart-change{margin-left:10px;font-weight:700}.chart-ranges{display:flex;gap:5px}.chart-range{padding:7px 10px;font-size:11px}.chart-range.selected{background:var(--accent);color:#fff}.chart-stats{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-size:12px;color:var(--muted)}.price-chart.detailed{margin-top:6px}.price-chart.detailed svg{height:390px;background:#0b1322;border-radius:12px}.chart-axis{fill:#91a0bb;font-size:12px}.chart-grid{stroke:#263553;stroke-width:1}.chart-history{fill:none;stroke:#7c8cff;stroke-width:3}.chart-short{stroke:#43d17d;stroke-width:3;stroke-dasharray:8 6}.chart-bull{stroke:#43d17d;stroke-width:2;stroke-dasharray:5 5}.chart-bear{stroke:#ff647c;stroke-width:2;stroke-dasharray:5 5}.chart-long{stroke:#f2c14e;stroke-width:3;stroke-dasharray:10 6}.chart-dot{fill:#eef3ff}.chart-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;font-size:11px;color:#91a0bb}@media(max-width:600px){.chart-toolbar{align-items:flex-start;flex-direction:column}.chart-ranges{width:100%}.chart-range{flex:1}.price-chart.detailed svg{height:300px}.chart-axis{font-size:10px}.chart-stats{gap:10px}}.price-chart{margin-top:10px}.price-chart svg{width:100%;height:250px;display:block;background:#0b1322;border-radius:12px}.chart-grid{stroke:#263553;stroke-width:1}.chart-history{fill:none;stroke:#7c8cff;stroke-width:3}.chart-short{stroke:#43d17d;stroke-width:3;stroke-dasharray:7 6}.chart-bull{stroke:#43d17d;stroke-width:2;stroke-dasharray:5 5}.chart-bear{stroke:#ff647c;stroke-width:2;stroke-dasharray:5 5}.chart-long{stroke:#f2c14e;stroke-width:3;stroke-dasharray:9 6}.chart-dot{fill:#eef3ff}.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:11px;color:#91a0bb}.chart-empty{padding:30px;text-align:center;color:#91a0bb}.signal{background:#0d1627;border-left:3px solid var(--accent);padding:14px;border-radius:9px;line-height:1.7;color:#cbd5e9}.notice{margin-top:22px;font-size:11px;line-height:1.6;color:var(--muted)}.section-title{margin:20px 0 10px;font-size:15px}.live{font-size:11px;color:var(--up);margin-left:6px}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.date{text-align:left}}@media(max-width:450px){h1{font-size:24px}.app{padding:18px 12px}}
</style></head>
<body><div class="app">
<header><div><h1>Market & Career Dashboard</h1><div class="sub">반도체 · 게임 · IT 주식 / 게임 개발자 취업 · 개발 동향</div></div><div class="date">개인 리포트 대시보드<br>GitHub Pages</div></header>
<nav><button class="active" data-view="v0">종합</button><button data-view="v1">주식</button><button data-view="v2">취업시장</button><button data-view="v3">개발 동향</button><button data-view="v4">신기술 · IT</button></nav>
<section id="v0" class="view active"><div id="summary" class="cards"></div><div class="grid"><div class="card"><div class="label">주요 뉴스 · 영향 분석</div><div id="topnews"></div></div><div class="card"><div class="label">데이터 상태</div><div id="status" class="signal">데이터를 불러오는 중...</div></div></div></section>
<section id="v1" class="view">
  <div class="card"><div class="label">종합 지수 <span class="live">● 실시간 갱신</span></div><div id="indices"></div></div>
  <div class="card" style="margin-top:18px"><div class="label">한국 주식</div><div id="koreaStocks"></div></div>
  <div class="card" style="margin-top:18px"><div class="label">미국 · 글로벌 반도체</div><div id="usStocks"></div></div>
  <div class="card" style="margin-top:18px"><div class="label">반도체 ETF</div><div id="etfs"></div></div>
</section>
<section id="v2" class="view"><div class="grid"><div class="card"><div class="label">취업시장</div><div id="jobs"></div></div><div class="card"><div class="label">최근 채용시장 관련 정보</div><div id="jobnews"></div></div></div></section>
<section id="v3" class="view"><div class="card"><div class="label">개발 동향</div><div id="trends"></div></div></section>
<section id="v4" class="view"><div class="grid"><div class="card"><div class="label">신기술 · IT</div><div id="technews"></div></div><div class="card"><div class="label">자동 업데이트</div><div class="signal">시장 데이터는 브라우저에서 주기적으로 갱신하고, 뉴스·취업·개발 데이터는 GitHub Actions가 수집합니다.</div></div></div></section>
<div class="notice" id="notice">데이터 정책을 불러오는 중...</div></div><div id="stockModal" class="modal" onclick="if(event.target===this)closeStock()"><div class="modal-box"><div id="stockDetail"></div></div></div>
</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const cls=v=>v==null?"":v>=0?"up":"down";
function showView(id,button){document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===button));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===id));window.scrollTo(0,0)}
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(!b)return;showView(b.dataset.view,b)});

let cached;
async function loadData(){
 try{
  cached=await fetch("data/dashboard.json?"+Date.now()).then(r=>r.json());
  render(cached);
 }catch(e){document.getElementById("status").textContent="데이터를 불러오지 못했습니다.";}
}
function stockRow(s){
 const isUS=/^(NVDA|AMD|INTC|AVGO|MU|TSM)$/.test(s.symbol);
 const isETF=/^(SOXX|SMH)$/.test(s.symbol);
 const isIndex=/^\^(KS11|KQ11|IXIC|GSPC|SOX)$/.test(s.symbol);
 const unit=isIndex?" pt":(isUS||isETF?" $":" ₩");
 const price=s.price==null?"데이터 없음":Number(s.price).toLocaleString(undefined,{maximumFractionDigits:2})+unit;
 const change=s.change==null?"-":(s.change>=0?"+":"")+Number(s.change).toFixed(2)+"%";
 const live=s.live?" · 실시간":"";
 return '<div class="item stock-click" data-symbol="'+esc(s.symbol)+'" onclick="openStockBySymbol(this.dataset.symbol)"><h3>'+esc(s.name)+' <span class="'+cls(s.change)+'">'+change+'</span></h3><p>'+price+' · '+esc(s.symbol)+live+' · 클릭하여 상세분석</p></div>';
}
function formatPrice(s,v){if(v==null)return "데이터 없음";const isUS=/^(NVDA|AMD|INTC|AVGO|MU|TSM|SOXX|SMH)$/.test(s.symbol);const isIndex=/^\^(KS11|KQ11|IXIC|GSPC|SOX)$/.test(s.symbol);return Number(v).toLocaleString(undefined,{maximumFractionDigits:2})+(isIndex?" pt":isUS?" $":" ₩")}
function findStock(symbol){return [...(cached?.stocks||[]),...(cached?.indices||[])].find(x=>x.symbol===symbol)||null;}
let currentStock=null;
function makeStockChart(s,requested=22){
 const h=(s.history||[]).map(Number).filter(Number.isFinite);
 if(h.length<2)return '<div class="chart-empty">차트 데이터가 없습니다.</div>';
 const f=s.forecast||{},sh=f.short||{},lo=f.long||{};
 const w=900,H=390,pL=62,pR=18,pT=24,pB=42;
 const unit=/^\^(KS11|KQ11|IXIC|GSPC|SOX)$/.test(s.symbol)?"pt":/^(NVDA|AMD|INTC|AVGO|MU|TSM|SOXX|SMH)$/.test(s.symbol)?"$":"₩";
 const ranges=[{n:"1M",v:22},{n:"3M",v:63},{n:"1Y",v:h.length}];
 const id="chart_"+String(s.symbol).replace(/[^a-zA-Z0-9]/g,"");
 const all=[...h,sh.bull,sh.bear,lo.base].filter(Number.isFinite);
 const min=Math.min(...all),max=Math.max(...all),pad=(max-min)*.08||1,yMin=min-pad,yMax=max+pad;
 function makeRange(n){
   const count=Math.min(n,h.length), data=h.slice(-count), vals=data;
   const hi=Math.max(...vals),loV=Math.min(...vals),chg=data.length>1?(data[data.length-1]/data[0]-1)*100:0;
   const pts=data.map((v,i)=>{const x=pL+(i/(data.length-1))*(w-pL-pR);const y=pT+(1-(v-yMin)/(yMax-yMin))*(H-pT-pB);return x+","+y}).join(" ");
   const last=data[data.length-1],ly=pT+(1-(last-yMin)/(yMax-yMin))*(H-pT-pB);
   const fy=v=>pT+(1-(v-yMin)/(yMax-yMin))*(H-pT-pB);
   const xForecast=w-pR;
   const base=Number.isFinite(sh.base)?sh.base:last,bull=Number.isFinite(sh.bull)?sh.bull:last,bear=Number.isFinite(sh.bear)?sh.bear:last,long=Number.isFinite(lo.base)?lo.base:last;
   const fx0=pL+(data.length-1)/(data.length+8)*(w-pL-pR),fx1=pL+(data.length)/(data.length+8)*(w-pL-pR),fx2=pL+(data.length+4)/(data.length+8)*(w-pL-pR),fx3=w-pR;
   const grid=[0,1,2,3,4].map(i=>{const y=pT+i*(H-pT-pB)/4;const val=yMax-i*(yMax-yMin)/4;return '<line x1="'+pL+'" y1="'+y+'" x2="'+w+'" y2="'+y+'" class="chart-grid"/><text x="'+(pL-8)+'" y="'+(y+4)+'" text-anchor="end" class="chart-axis">'+Number(val).toLocaleString(undefined,{maximumFractionDigits:2})+unit+'</text>'}).join("");
   const labels=[0,Math.floor((data.length-1)/2),data.length-1].map((i,j)=>{const x=pL+(i/(data.length-1))*(w-pL-pR);return '<text x="'+x+'" y="'+(H-12)+'" text-anchor="'+(j===0?"start":j===2?"end":"middle")+'" class="chart-axis">'+(n===h.length?["1년 전","6개월 전","현재"][j]:j===0?"시작":j===1?"중간":"현재")+'</text>'}).join("");
   return {data,hi,loV,chg,pts,ly,fy,base,bull,bear,long,fx0,fx1,fx2,fx3,grid,labels};
 }
 const d=makeRange(Math.min(requested,h.length));
 return '<div class="chart-toolbar"><div><b>가격 흐름</b><span class="chart-change '+(d.chg>=0?"up":"down")+'">'+(d.chg>=0?"+":"")+d.chg.toFixed(2)+'%</span></div><div class="chart-ranges">'+ranges.map(r=>'<button type="button" class="chart-range '+(r.v===Math.min(22,h.length)?"selected":"")+'" onclick="setChartRange('${s.symbol}',${r.v})" data-chart="'+id+'" data-range="'+r.v+'">'+r.n+'</button>').join("")+'</div></div>'+
 '<div class="chart-stats"><span>고가 <b>'+formatPrice(s,d.hi)+'</b></span><span>저가 <b>'+formatPrice(s,d.loV)+'</b></span><span>현재 <b>'+formatPrice(s,s.price)+'</b></span></div>'+
 '<div class="price-chart detailed"><svg id="'+id+'" viewBox="0 0 '+w+' '+H" role="img" aria-label="'+esc(s.name)+' 상세 주가 차트">'+d.grid+
 '<polyline points="'+d.pts+'" class="chart-history"/>'+
 '<line x1="'+d.fx0+'" y1="'+d.ly+'" x2="'+d.fx1+'" y2="'+d.fy(d.base)+'" class="chart-short"/>'+
 '<line x1="'+d.fx1+'" y1="'+d.fy(d.base)+'" x2="'+d.fx2+'" y2="'+d.fy(d.bull)+'" class="chart-bull"/>'+
 '<line x1="'+d.fx1+'" y1="'+d.fy(d.base)+'" x2="'+d.fx2+'" y2="'+d.fy(d.bear)+'" class="chart-bear"/>'+
 '<line x1="'+d.fx2+'" y1="'+d.fy(d.base)+'" x2="'+d.fx3+'" y2="'+d.fy(d.long)+'" class="chart-long"/>'+
 '<circle cx="'+(pL+(d.data.length-1)/(d.data.length-1)*(w-pL-pR))+'" cy="'+d.ly+'" r="6" class="chart-dot"/>'+d.labels+'</svg></div>'+
 '<div class="chart-legend"><span>실제 가격</span><span>단기 기준</span><span>상승</span><span>하락</span><span>장기 기준</span></div>'+
 '<p class="mini">단기/장기 점선은 확정 가격이 아니라 현재 추세와 변동성을 이용한 참고 시나리오입니다.</p>';
}
function bindChartRanges(){
 document.querySelectorAll(".chart-range").forEach(btn=>btn.onclick=()=>{
   const s=findStock(document.querySelector(".modal-box .muted")?.textContent||"");
 });
}
function stockNews(s){
 const news=cached?.news||[];
 const name=s.name.toLowerCase();
 const aliases={NVIDIA:['nvidia','엔비디아'],AMD:['amd'],Intel:['intel','인텔'],Broadcom:['broadcom','브로드컴'],Micron:['micron','마이크론'],TSMC:['tsmc'],삼성전자:['삼성전자','삼성'],SK하이닉스:['sk하이닉스','sk hynix'],한미반도체:['한미반도체'],엔씨소프트:['엔씨소프트','ncsoft']};
 const keys=aliases[s.name]||[name];
 let arr=news.filter(n=>keys.some(k=>String(n.title).toLowerCase().includes(k)));
 if(!arr.length) arr=news.filter(n=>s.category.includes('반도체')?(/반도체|hbm|ai|semiconductor/i.test(n.title)):/게임|게임사|신작/i.test(n.title));
 return arr.slice(0,5);
}
function openStockBySymbol(symbol){const s=findStock(symbol);if(s)openStock(s)}
function setChartRange(symbol,count){const s=findStock(symbol);if(!s)return;const el=document.getElementById("stockChartArea");if(el)el.innerHTML=makeStockChart(s,count)}
function openStock(s){
 const f=s.forecast||{}, sh=f.short||{}, lo=f.long||{};
 const history=(s.history||[]).map(Number).filter(Number.isFinite);
 const recent=history.length?history[history.length-1]:s.price;
 document.getElementById("stockDetail").innerHTML='<div class="modal-head"><div><div class="label">주식 상세 분석</div><h2>'+esc(s.name)+'</h2><div class="muted">'+esc(s.symbol)+'</div></div><button class="modal-close" onclick="closeStock()">×</button></div>'+
 '<div class="card" style="margin-top:14px"><div class="label">최근 흐름</div><div class="big">'+formatPrice(s,s.price)+'</div><div class="'+cls(s.change)+'">'+(s.change>=0?"+":"")+Number(s.change||0).toFixed(2)+'%</div><p class="mini">최근 수집된 가격 흐름을 기준으로 분석합니다. 마지막 데이터: '+esc(cached?.updatedAt||"-")+'</p></div>'+
 '<div id="stockChartArea" class="card chart-card"><div class="label">주가 차트 · 최근 흐름 + 전망</div>'+makeStockChart(s)+'</div>'+
 '<div class="forecast"><div class="forecast-card"><div class="label">단기 전망 · 1~4주</div><div class="forecast-price">'+formatPrice(s,sh.base)+'</div><div class="'+(sh.trend==="하락"?"down":sh.trend==="상승"?"up":"muted")+'">추세: '+esc(sh.trend||"중립")+'</div><p class="mini">상승 시나리오: '+formatPrice(s,sh.bull)+'<br>하락 시나리오: '+formatPrice(s,sh.bear)+'</p></div><div class="forecast-card"><div class="label">장기 전망 · 6~12개월</div><div class="forecast-price">'+formatPrice(s,lo.base)+'</div><div class="'+(lo.trend==="하락"?"down":lo.trend==="상승"?"up":"muted")+'">추세: '+esc(lo.trend||"중립")+'</div><p class="mini">장기 추세는 최근 1년 가격 흐름을 이용한 참고 시나리오입니다.</p></div></div>'+
 '<div class="card" style="margin-top:14px"><div class="label">관련 뉴스</div>'+stockNews(s).map(n=>'<div class="item"><h3><a href="'+esc(n.link)+'" target="_blank" rel="noopener">'+esc(n.title)+'</a></h3><p>'+esc(n.published)+' · '+esc(n.impact||"중립")+' · '+esc(n.importance||"보통")+'</p></div>').join("")+'</div>'+
 '<div class="signal" style="margin-top:14px">주의: 전망선은 최근 가격 추세와 변동성을 이용한 참고용 시나리오입니다. 실제 주가는 실적, 금리, 환율, 산업 뉴스 등 외부 요인에 따라 달라질 수 있습니다.</div>';
 currentStock=s;document.getElementById("stockModal").classList.add("open");document.body.style.overflow="hidden";
}
function closeStock(){document.getElementById("stockModal").classList.remove("open");document.body.style.overflow=""}

function render(d){
 document.getElementById("summary").innerHTML=d.stocks.slice(0,4).map(s=>'<div class="card"><div class="label">'+esc(s.name)+'</div><div class="big">'+(s.price==null?"-":Number(s.price).toLocaleString())+'</div><div class="'+cls(s.change)+'">'+(s.change==null?"데이터 없음":(s.change>=0?"+":"")+Number(s.change).toFixed(2)+"%")+'</div></div>').join("");
 const news=d.news||[], renderNews=arr=>arr.slice(0,8).map(n=>'<div class="item"><h3><a href="'+esc(n.link)+'" target="_blank" rel="noopener">'+esc(n.title)+'</a></h3><p>'+esc(n.published)+' · 중요도 <b>'+esc(n.importance||"미분류")+'</b> · 영향 <b>'+esc(n.impact||"미분류")+'</b></p></div>').join("")||'<p class="muted">뉴스 없음</p>';
 document.getElementById("topnews").innerHTML=renderNews(news.slice(0,6));
 document.getElementById("jobnews").innerHTML=renderNews(news.filter(n=>/채용|개발자|게임 개발/i.test(n.title)));
 document.getElementById("technews").innerHTML=renderNews(news.filter(n=>/AI|반도체|신기술|개발/i.test(n.title)));
 const indices=d.indices||[];
 document.getElementById("indices").innerHTML=indices.filter(x=>["^KS11","^KQ11","^IXIC","^GSPC","^SOX"].includes(x.symbol)).map(stockRow).join("");
 document.getElementById("koreaStocks").innerHTML=d.stocks.filter(x=>x.category==="한국 반도체"||x.category==="한국 게임").map(stockRow).join("");
 document.getElementById("usStocks").innerHTML=d.stocks.filter(x=>x.category==="미국 반도체"||x.category==="미국/글로벌 반도체").map(stockRow).join("");
 document.getElementById("etfs").innerHTML=indices.filter(x=>["SOXX","SMH"].includes(x.symbol)).map(stockRow).join("");

async function liveQuotes(){
 // 시세는 GitHub Actions가 수집한 dashboard.json을 사용합니다.
 // 브라우저에서 Yahoo Finance를 직접 호출하지 않아 CORS 오류를 방지합니다.
 try{
  const fresh=await fetch("data/dashboard.json?"+Date.now()).then(r=>r.json());
  cached=fresh;
  render(cached);
 }catch(e){
  // 마지막으로 성공한 데이터 유지
 }
}
loadData();
setInterval(liveQuotes,60000);
