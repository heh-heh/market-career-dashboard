<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market & Career Dashboard</title>
<style>
:root{--bg:#080d18;--panel:#111a2c;--line:#263553;--text:#eef3ff;--muted:#91a0bb;--accent:#7c8cff;--up:#43d17d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#182447,#080d18 45%);color:var(--text);font-family:system-ui,"Noto Sans KR",sans-serif}.app{max-width:1180px;margin:auto;padding:24px 16px 50px}
header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}h1{margin:0;font-size:30px}.sub,.muted{color:var(--muted)}.date{text-align:right;font-size:12px;color:var(--muted)}
nav{display:flex;gap:8px;overflow:auto;margin-bottom:20px}button{border:1px solid var(--line);background:#0e1627;color:var(--muted);padding:11px 15px;border-radius:11px;cursor:pointer;white-space:nowrap}button.active{background:var(--accent);color:white}
.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.card{background:#111a2cf0;border:1px solid var(--line);border-radius:16px;padding:17px}.label{font-size:12px;color:var(--muted)}.big{font-size:24px;font-weight:800;margin:7px 0}.up{color:var(--up)}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item h3{font-size:14px;margin:0 0 6px}.item p{font-size:13px;line-height:1.65;color:#c6d0e4;margin:0}.tag{display:inline-block;background:#202c49;border-radius:999px;padding:5px 8px;font-size:11px;margin:4px}.signal{background:#0d1627;border-left:3px solid var(--accent);padding:14px;border-radius:9px;line-height:1.7;color:#cbd5e9}.notice{margin-top:22px;font-size:11px;line-height:1.6;color:var(--muted)}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.date{text-align:left}}@media(max-width:450px){h1{font-size:24px}.app{padding:18px 12px}}
</style></head>
<body><div class="app">
<header><div><h1>Market & Career Dashboard</h1><div class="sub">반도체 · 게임 · IT 주식 / 게임 개발자 취업 · 개발 동향</div></div><div class="date">개인 리포트 대시보드<br>GitHub Pages</div></header>
<nav><button class="active" data-view="v0">종합</button><button data-view="v1">주식</button><button data-view="v2">취업시장</button><button data-view="v3">개발 동향</button><button data-view="v4">신기술 · IT</button></nav>
<section id="v0" class="view active"><div id="summary" class="cards"></div><div class="grid"><div class="card"><div class="label">주요 뉴스 · 영향 분석</div><div id="topnews"></div></div><div class="card"><div class="label">데이터 상태</div><div id="status" class="signal">데이터를 불러오는 중...</div></div></div></section>
<section id="v1" class="view"><div class="card"><div class="label">관심 종목</div><div id="stocks"></div></div></section>
<section id="v2" class="view"><div class="grid"><div class="card"><div class="label">취업시장</div><div id="jobs"></div></div><div class="card"><div class="label">최근 채용시장 관련 정보</div><div id="jobnews"></div></div></div></section>
<section id="v3" class="view"><div class="card"><div class="label">개발 동향</div><div id="trends"></div></div></section>
<section id="v4" class="view"><div class="grid"><div class="card"><div class="label">신기술 · IT</div><div id="technews"></div></div><div class="card"><div class="label">자동 업데이트</div><div class="signal">GitHub Actions가 정기적으로 공개 데이터를 수집하고 data/dashboard.json을 갱신합니다.</div></div></div></section>
<div class="notice" id="notice">데이터 정책을 불러오는 중...</div>
</div><script>
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.view).classList.add("active");scrollTo({top:0,behavior:"smooth"})});
async function loadData(){try{
const d=await fetch("data/dashboard.json?"+Date.now()).then(r=>r.json());
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
document.getElementById("summary").innerHTML=d.stocks.slice(0,4).map(s=>'<div class="card"><div class="label">'+esc(s.name)+'</div><div class="big">'+(s.price==null?"-":Number(s.price).toLocaleString())+'</div><div class="'+(s.change>=0?"up":"")+'">'+(s.change==null?"데이터 없음":(s.change>=0?"+":"")+Number(s.change).toFixed(2)+"%")+'</div></div>').join("");
const news=d.news||[];
const renderNews=(arr)=>arr.slice(0,8).map(n=>'<div class="item"><h3><a href="'+esc(n.link)+'" target="_blank" rel="noopener">'+esc(n.title)+'</a></h3><p>'+esc(n.published)+' · 중요도 <b>'+esc(n.importance||"미분류")+'</b> · 영향 <b>'+esc(n.impact||"미분류")+'</b></p></div>').join("")||'<p class="muted">뉴스 없음</p>';
document.getElementById("topnews").innerHTML=renderNews(news.slice(0,6));
document.getElementById("jobnews").innerHTML=renderNews(news.filter(n=>/채용|개발자|게임 개발/i.test(n.title)));
document.getElementById("technews").innerHTML=renderNews(news.filter(n=>/AI|반도체|신기술|개발/i.test(n.title)));
document.getElementById("stocks").innerHTML=d.stocks.map(s=>'<div class="item"><h3>'+esc(s.name)+' <span class="'+(s.change>=0?"up":"")+'">'+(s.change==null?"-":(s.change>=0?"+":"")+Number(s.change).toFixed(2)+"%")+'</span></h3><p>'+(s.price==null?"시세 조회 실패":Number(s.price).toLocaleString())+' · '+esc(s.symbol)+'</p></div>').join("");
document.getElementById("jobs").innerHTML=d.employment.map(j=>'<div class="item"><h3>'+esc(j.title)+'</h3><p>'+j.skills.map(esc).map(x=>'<span class="tag">'+x+'</span>').join("")+'</p></div>').join("");
document.getElementById("trends").innerHTML=d.trends.map(t=>'<div class="item"><h3>'+esc(t.title)+'</h3><p>'+esc(t.text)+'</p></div>').join("");
document.getElementById("status").innerHTML="마지막 데이터 갱신: <b>"+esc(d.updatedAt||"-")+"</b><br>"+esc(d.notice||"");
document.getElementById("notice").textContent=d.notice||"";
}catch(e){document.getElementById("status").textContent="데이터를 불러오지 못했습니다. GitHub Actions 실행 상태를 확인하세요.";document.getElementById("notice").textContent="자동 수집 데이터가 아직 생성되지 않았거나 일시적인 오류가 발생했습니다.";}}
loadData();
</script></body></html>
