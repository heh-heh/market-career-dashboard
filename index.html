<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market & Career Dashboard</title>
<style>
:root{--bg:#080d18;--panel:#111a2c;--line:#263553;--text:#eef3ff;--muted:#91a0bb;--accent:#7c8cff;--up:#43d17d;--down:#ff647c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#182447,#080d18 45%);color:var(--text);font-family:system-ui,"Noto Sans KR",sans-serif}.app{max-width:1180px;margin:auto;padding:24px 16px 50px}
header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}h1{margin:0;font-size:30px}.sub,.muted{color:var(--muted)}.date{text-align:right;font-size:12px;color:var(--muted)}
nav{display:flex;gap:8px;overflow:auto;margin-bottom:20px}button{border:1px solid var(--line);background:#0e1627;color:var(--muted);padding:11px 15px;border-radius:11px;cursor:pointer;white-space:nowrap}button.active{background:var(--accent);color:white}
.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.card{background:#111a2cf0;border:1px solid var(--line);border-radius:16px;padding:17px}.label{font-size:12px;color:var(--muted)}.big{font-size:24px;font-weight:800;margin:7px 0}.up{color:var(--up)}.down{color:var(--down)}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item h3{font-size:14px;margin:0 0 6px}.item p{font-size:13px;line-height:1.65;color:#c6d0e4;margin:0}.tag{display:inline-block;background:#202c49;border-radius:999px;padding:5px 8px;font-size:11px;margin:4px}.signal{background:#0d1627;border-left:3px solid var(--accent);padding:14px;border-radius:9px;line-height:1.7;color:#cbd5e9}.notice{margin-top:22px;font-size:11px;line-height:1.6;color:var(--muted)}.section-title{margin:20px 0 10px;font-size:15px}.live{font-size:11px;color:var(--up);margin-left:6px}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.date{text-align:left}}@media(max-width:450px){h1{font-size:24px}.app{padding:18px 12px}}
</style></head>
<body><div class="app">
<header><div><h1>Market & Career Dashboard</h1><div class="sub">반도체 · 게임 · IT 주식 / 게임 개발자 취업 · 개발 동향</div></div><div class="date">개인 리포트 대시보드<br>GitHub Pages</div></header>
<nav><button class="active" data-view="v0">종합</button><button data-view="v1">주식</button><button data-view="v2">취업시장</button><button data-view="v3">개발 동향</button><button data-view="v4">신기술 · IT</button></nav>
<section id="v0" class="view active"><div id="summary" class="cards"></div><div class="grid"><div class="card"><div class="label">주요 뉴스 · 영향 분석</div><div id="topnews"></div></div><div class="card"><div class="label">데이터 상태</div><div id="status" class="signal">데이터를 불러오는 중...</div></div></div></section>
<section id="v1" class="view">
  <div class="card"><div class="label">종합 지수 <span class="live">● 실시간 갱신</span></div><div id="indices"></div></div>
  <div class="card" style="margin-top:18px"><div class="label">한국 주식</div><div id="koreaStocks"></div></div>
  <div class="card" style="margin-top:18px"><div class="label">미국 · 글로벌 반도체</div><div id="usStocks"></div></div>
  <div class="card" style="margin-top:18px"><div class="label">반도체 ETF</div><div id="etfs"></div></div>
</section>
<section id="v2" class="view"><div class="grid"><div class="card"><div class="label">취업시장</div><div id="jobs"></div></div><div class="card"><div class="label">최근 채용시장 관련 정보</div><div id="jobnews"></div></div></div></section>
<section id="v3" class="view"><div class="card"><div class="label">개발 동향</div><div id="trends"></div></div></section>
<section id="v4" class="view"><div class="grid"><div class="card"><div class="label">신기술 · IT</div><div id="technews"></div></div><div class="card"><div class="label">자동 업데이트</div><div class="signal">시장 데이터는 브라우저에서 주기적으로 갱신하고, 뉴스·취업·개발 데이터는 GitHub Actions가 수집합니다.</div></div></div></section>
<div class="notice" id="notice">데이터 정책을 불러오는 중...</div>
</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const cls=v=>v==null?"":v>=0?"up":"down";
function showView(id,button){document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===button));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===id));window.scrollTo(0,0)}
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(!b)return;showView(b.dataset.view,b)});

let cached;
async function loadData(){
 try{
  cached=await fetch("data/dashboard.json?"+Date.now()).then(r=>r.json());
  render(cached);
 }catch(e){document.getElementById("status").textContent="데이터를 불러오지 못했습니다.";}
}
function stockRow(s){
 const isUS=/^(NVDA|AMD|INTC|AVGO|MU|TSM)$/.test(s.symbol);
 const isETF=/^(SOXX|SMH)$/.test(s.symbol);
 const isIndex=/^(\\^KS11|\\^KQ11|\\^IXIC|\\^GSPC|\\^SOX)$/.test(s.symbol);
 const unit=isIndex?" pt":(isUS||isETF?" $":" ₩");
 const price=s.price==null?"데이터 없음":Number(s.price).toLocaleString(undefined,{maximumFractionDigits:2})+unit;
 const change=s.change==null?"-":(s.change>=0?"+":"")+Number(s.change).toFixed(2)+"%";
 const live=s.live?" · 실시간":"";
 return '<div class="item"><h3>'+esc(s.name)+' <span class="'+cls(s.change)+'">'+change+'</span></h3><p>'+price+' · '+esc(s.symbol)+live+'</p></div>';
}
function render(d){
 document.getElementById("summary").innerHTML=d.stocks.slice(0,4).map(s=>'<div class="card"><div class="label">'+esc(s.name)+'</div><div class="big">'+(s.price==null?"-":Number(s.price).toLocaleString())+'</div><div class="'+cls(s.change)+'">'+(s.change==null?"데이터 없음":(s.change>=0?"+":"")+Number(s.change).toFixed(2)+"%")+'</div></div>').join("");
 const news=d.news||[], renderNews=arr=>arr.slice(0,8).map(n=>'<div class="item"><h3><a href="'+esc(n.link)+'" target="_blank" rel="noopener">'+esc(n.title)+'</a></h3><p>'+esc(n.published)+' · 중요도 <b>'+esc(n.importance||"미분류")+'</b> · 영향 <b>'+esc(n.impact||"미분류")+'</b></p></div>').join("")||'<p class="muted">뉴스 없음</p>';
 document.getElementById("topnews").innerHTML=renderNews(news.slice(0,6));
 document.getElementById("jobnews").innerHTML=renderNews(news.filter(n=>/채용|개발자|게임 개발/i.test(n.title)));
 document.getElementById("technews").innerHTML=renderNews(news.filter(n=>/AI|반도체|신기술|개발/i.test(n.title)));
 const indices=d.indices||[];
 document.getElementById("indices").innerHTML=indices.filter(x=>["^KS11","^KQ11","^IXIC","^GSPC","^SOX"].includes(x.symbol)).map(stockRow).join("");
 document.getElementById("koreaStocks").innerHTML=d.stocks.filter(x=>x.category==="한국 반도체"||x.category==="한국 게임").map(stockRow).join("");
 document.getElementById("usStocks").innerHTML=d.stocks.filter(x=>x.category==="미국 반도체"||x.category==="미국/글로벌 반도체").map(stockRow).join("");
 document.getElementById("etfs").innerHTML=indices.filter(x=>["SOXX","SMH"].includes(x.symbol)).map(stockRow).join("");
 document.getElementById("jobs").innerHTML=(d.employment||[]).map(j=>'<div class="item"><h3>'+esc(j.title)+'</h3><p>'+j.skills.map(esc).map(x=>'<span class="tag">'+x+'</span>').join("")+'</p></div>').join("");
 document.getElementById("trends").innerHTML=(d.trends||[]).map(t=>'<div class="item"><h3>'+esc(t.title)+'</h3><p>'+esc(t.text)+'</p></div>').join("");
 document.getElementById("status").innerHTML="마지막 데이터 갱신: <b>"+esc(d.updatedAt||"-")+"</b><br>"+esc(d.notice||"");
 document.getElementById("notice").textContent=d.notice||"";
}
async function liveQuotes(){
 // 시세는 GitHub Actions가 수집한 dashboard.json을 사용합니다.
 // 브라우저에서 Yahoo Finance를 직접 호출하지 않아 CORS 오류를 방지합니다.
 try{
  const fresh=await fetch("data/dashboard.json?"+Date.now()).then(r=>r.json());
  cached=fresh;
  render(cached);
 }catch(e){
  // 마지막으로 성공한 데이터 유지
 }
}
loadData();
setInterval(liveQuotes,60000);
</script></body></html>
