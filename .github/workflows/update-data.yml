name: Update dashboard data
# job-posting-feed
# live-job-refresh

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: ["main"]
    paths-ignore:
      - "data/dashboard.json"
  workflow_dispatch:

concurrency:
  group: update-dashboard-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate Python sources
        run: python -m py_compile server.py live_trader.py trading.py scripts/update_data.py

      - name: Collect public data
        run: python scripts/update_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "data: update dashboard"
          git push

