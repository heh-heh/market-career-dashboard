name: Update dashboard data
# job-posting-feed
# live-job-refresh

on:
  workflow_dispatch:

concurrency:
  group: update-dashboard-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate Python sources
        run: python -m py_compile server.py live_trader.py strategy_engine.py trading.py pattern_engine.py scripts/update_data.py scripts/analyze_patterns.py scripts/collect_toss_1m.py research/backtest_multistrategy_v1.py

      - name: Collect public data
        run: python scripts/update_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "data: update dashboard"
          git push

