name: Strategy engine checks

on:
  push:
    branches: ["strategy-engine-v3"]
  pull_request:
    paths:
      - "strategy_engine.py"
      - "live_trader.py"
      - "server.py"
      - "research_export.py"
      - "research_export_metadata.py"
      - "research-export.js"
      - "research-export.css"
      - "research/test_research_export*"
      - "v07_web_jobs.py"
      - "v07_research_report.py"
      - "scripts/install_v07_web_console_overlay.py"
      - "research/test_v07*"
      - "research/evolution/**"
      - "research/test_evolution*"
      - "research/autonomous/**"
      - "research/test_autonomous*"
      - "autonomous-research.js"
      - "scripts/collect_toss_1m.py"
      - "scripts/collect_research_1m.py"
      - "scripts/deploy_collection.sh"
      - "scripts/deploy_collection_worktree.py"
      - "research/test_collection_worktree_deploy.py"
      - "research_collection_scheduler.py"
      - "research/collection_download.py"
      - "research/test_research_collection_scheduler.py"
      - "research/test_collection_scheduler_smoke.cjs"
      - "toss_rate_limit.py"
      - "toss_token_broker.py"
      - "scripts/repair_toss_1m.py"
      - "research/toss_1m_repair.py"
      - "research/test_toss_1m_repair.py"
      - "research/backtest_multistrategy_v1.py"
      - "research/backtest_v2_tqqq_mr.py"
      - ".github/workflows/strategy-engine-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Installer regression tests compare against a pinned predecessor commit.
          # Shallow checkout depth 1 omits it and fails without exercising code.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile strategy sources
        run: |
          python -m py_compile research_collection_scheduler.py scripts/collect_research_1m.py research/collection_download.py toss_token_broker.py toss_rate_limit.py
          python -m py_compile scripts/deploy_collection_worktree.py research/test_collection_worktree_deploy.py
          python -m py_compile research/toss_1m_repair.py research/test_toss_1m_repair.py scripts/repair_toss_1m.py
          python -m py_compile strategy_engine.py live_trader.py paper_trader.py simple_momentum_v1.py server.py backtest_manager.py scripts/collect_toss_1m.py research/backtest_multistrategy_v1.py research/backtest_v2_tqqq_mr.py research/backtest_simple_v1.py research/backtest_intraday_v4.py research/test_simple_momentum_v1.py research/test_simple_momentum_api.py research/test_backtest_simple_v1.py research/test_backtest_engines_api.py research/test_backtest_multistrategy_streaming.py research/run_v4_sequence.py research/test_run_v4_sequence.py scripts/collect_toss_ticks.py research/intraday_v4_metrics.py research/evolution/config.py research/evolution/resource.py research/evolution/population.py research/evolution/run_evolution_v0.py research/evolution/evaluate_population_v03.py research/evolution/analyze_validation_v04.py research/evolution/run_v04_campaign.py research/evolution/run_v05_campaign.py research/evolution/run_v06_campaign.py research/evolution/run_v07_campaign.py research/evolution/build_shortlist_v07.py research/evolution/monitor.py research_export.py research_export_metadata.py research/test_research_export.py
      - name: Test paper engines
        run: |
          python -m py_compile v07_web_jobs.py v07_research_report.py scripts/install_v07_web_console_overlay.py
          python -m compileall -q research/autonomous research/evolution
          python -m unittest discover -s research -p 'test_*.py'
      - name: Smoke-test admin integration
        run: |
          for test in research/test_*_smoke.cjs; do
            node "$test"
          done
      - name: Smoke-test feature and scoring engine
        run: |
          python - <<'PY'
          import math
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from strategy_engine import evaluate_rows, score_universe, apply_trade_decision

          ny=ZoneInfo("America/New_York")
          start=datetime(2026,1,5,9,30,tzinfo=ny)
          rows=[]
          prev=100.0
          for i in range(180):
              px=100.0 + 0.025*i + 0.12*math.sin(i/5)
              o=prev
              c=px
              h=max(o,c)+0.08
              l=min(o,c)-0.08
              rows.append({
                  "timestamp":(start+timedelta(minutes=i)).isoformat(),
                  "openPrice":o,"highPrice":h,"lowPrice":l,"closePrice":c,
                  "volume":100000 + (i%17)*5000,
              })
              prev=c

          analysis=evaluate_rows(list(reversed(rows)))
          assert analysis["ready"] is True, analysis
          assert len(analysis["strategyScores"]) == 4, analysis
          candidate={
              "symbol":"TEST","name":"TEST","tradingVolume":20000000,
              "tradingAmountUsd":2000000000,"price":analysis["price"],
              "changePct":2.0, **analysis,
          }
          ranked=score_universe([candidate])
          assert len(ranked)==1
          apply_trade_decision(ranked[0],55)
          assert 0 <= ranked[0]["finalScore"] <= 100
          print(ranked[0]["bestStrategy"], ranked[0]["finalScore"], ranked[0]["signal"])
          PY
