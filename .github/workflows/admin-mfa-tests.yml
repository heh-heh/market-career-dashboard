name: Admin MFA security smoke
on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'admin-login.js'
      - 'index.html'
      - 'deploy/admin-console/**'
      - 'deploy/stock-collection/**'
      - '.github/workflows/admin-mfa-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile server authentication and run offline tests
        run: |
          python -m py_compile deploy/admin-console/{console.py,mfa_auth.py,setup_mfa.py,test_mfa.py}
          (cd deploy/admin-console && python test_mfa.py && python test_performance.py && python test_history_progress.py && python test_data_inventory.py && python test_tick_routes.py && python test_history_start.py)
      - name: Validate isolated 50-symbol historical patch and UI wiring
        run: |
          python3 -m py_compile deploy/stock-collection/patch-history-50.py deploy/stock-collection/test_patch_history_50.py deploy/admin-console/history_progress.py deploy/admin-console/data_inventory.py
          python3 deploy/stock-collection/test_patch_history_50.py
          bash -n deploy/stock-collection/setup.sh deploy/stock-collection/install-services.sh deploy/stock-collection/run-scheduler.sh deploy/stock-collection/control.sh deploy/stock-collection/history-control.sh deploy/stock-collection/tick-control.sh
          python3 - <<'PY'
          from pathlib import Path
          ui=Path("deploy/admin-console/index.html").read_text()
          js=Path("deploy/admin-console/app.js").read_text()
          api=Path("deploy/admin-console/console.py").read_text()
          assert 'id="history50Table"' in ui
          assert 'id="history50ScanBar"' in ui
          assert 'data-history-50="resume"' in ui
          assert 'data-history-50="pause"' in ui
          assert '"/api/history/status"' in js
          assert '"/api/history/control"' in js
          assert '"/api/history/status"' in api
          assert '"/api/history/control"' in api
          assert '"/api/history/start"' in api
          assert '"/api/history/start"' in js
          assert 'id="history50Persisted"' in ui
          assert 'id="history50Start"' in ui
          assert 'button.dataset.history50' not in js, "data-history-50 must not be read as dataset.history50"
          assert 'button.getAttribute("data-history-50")' in js
          assert 'class="history-danger-zone"' in ui
          assert api.index('session = active_session(self)') < api.index('elif path.path == "/api/history/status"')
          assert 'HISTORY_50_CONTROL_FILE' in Path("deploy/stock-collection/run-scheduler.sh").read_text()
          install=Path("deploy/stock-collection/install-services.sh").read_text()
          assert 'for name in run-broker.sh run-scheduler.sh control.sh history-control.sh tick-control.sh; do' in install
          assert 'CLI_HISTORY_RESUME' in Path("deploy/stock-collection/history-control.sh").read_text()
          assert 'for name in run-broker.sh run-scheduler.sh control.sh history-control.sh tick-control.sh; do' in install
          assert 'TICKS_DISABLED_BY_OPERATOR' in Path('deploy/stock-collection/patch-history-50.py').read_text()
          assert 'TICK_COLLECTION_CONTROL_FILE' in Path('deploy/stock-collection/run-scheduler.sh').read_text()
          assert '"enabled":False,"reason":"USER_REQUESTED_TICKS_PAUSED"' in install
          assert '"/api/ticks/control"' in api
          assert '"/api/data/inventory"' in api
          assert 'data-page="inventory"' in ui and 'id="page-inventory"' in ui
          assert 'data-page="ticks"' not in ui and 'id="page-ticks"' not in ui
          assert 'id="tickWorkerState"' in ui
          assert '"/api/data/inventory"' in js
          assert '"/api/ticks/control"' in js
          assert api.index('session = active_session(self)') < api.index('elif path.path == "/api/data/inventory"')
          print("TICK_PAUSED_AND_INVENTORY_UI=PASS")
          print("HISTORY_50_CONTROL_INSTALL_TEST=PASS")
          print("HISTORY_50_ADMIN_UI=PASS")
          PY
      - name: Validate browser login script and admin console script
        run: |
          node --check admin-login.js
          node --check deploy/admin-console/app.js
          node --check server-metrics.js
      - name: Verify Task Manager layout is private, responsive, and retains telemetry auth
        run: |
          python - <<'PY'
          from pathlib import Path
          ui=Path("deploy/admin-console/index.html").read_text()
          code=Path("deploy/admin-console/app.js").read_text()
          server=Path("deploy/admin-console/console.py").read_text()
          shared=Path("server-metrics.js").read_text()
          assert 'id="privateServerMetrics"' in ui
          assert 'class="server-performance-frame"' in ui
          assert 'id="serverPerfRefresh"' in ui
          assert 'id="serverDiagnostics"' in ui
          assert 'id="serverPerfState"' in ui
          assert 'ServerMetrics.render' in code
          assert 'get("/api/telemetry")' in code
          assert 'setInterval(' in code
          assert 'if(page==="server")void refreshServerPerformance();' in code
          assert 'states=new WeakMap()' in shared
          assert 'data-resource' in shared
          assert 'elif path.path == "/api/telemetry":' in server
          assert server.index('session = active_session(self)') < server.index('elif path.path == "/api/telemetry":')
          print("ADMIN_TASK_MANAGER_UI_TEST=PASS")
          PY
      - name: Validate JavaScript embedded in the main dashboard
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          inline=re.findall(r"<script[^>]*>(.*?)</script>",html,re.S)
          assert inline, "No scripts found in dashboard"
          for index,source in enumerate(inline):
              Path("/tmp/market-inline-"+str(index)+".js").write_text(source,encoding="utf-8")
          print("INLINE_SCRIPT_COUNT="+str(len(inline)))
          PY
          for file in /tmp/market-inline-*.js; do node --check "$file"; done
      - name: Ensure static login has no secret and is routed to private server
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path("admin.html").read_text(encoding="utf-8")
          app=Path("admin-login.js").read_text(encoding="utf-8")
          home=Path("index.html").read_text(encoding="utf-8")
          assert 'id="user"' in page and 'id="password"' in page and 'id="otp"' in page
          assert 'admin-login.js' in page
          assert 'heh-heh.tail39e546.ts.net:8444' in app
          assert 'const ADMIN_PORTAL_URL="./admin.html";' in home
          assert 'localStorage.setItem' not in app and 'sessionStorage.setItem' not in app
          assert 'fetch(HOST+"/api/remote/login"' in app
          assert '<button data-view="v7">관리자</button>' in home
          assert '<form id="login"' in home
          assert 'id="loginStatus"' in home
          assert 'src="./admin-login.js"' in home
          assert 'data-view="v7"],nav button[data-view="v9"]' not in home
          assert 'document.getElementById("loginStatus")' in app
          assert home.count('id="login"') == 1
          assert home.count('id="user"') == 1
          assert home.count('id="otp"') == 1
          print("STATIC_ADMIN_GATE=PASS")
          PY
