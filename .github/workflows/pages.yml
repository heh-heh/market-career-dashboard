name: Deploy GitHub Pages
on:
  push:
    branches: ["strategy-engine-v3"]
    paths:
      - "index.html"
      - "admin.html"
      - "collection.html"
      - "backtest-v2.html"
      - "research-export.js"
      - "research-export.css"
      - "autonomous-research.js"
      - "data/dashboard.json"
      - ".github/workflows/pages.yml"
concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble public UI only
        run: |
          mkdir -p _site/data
          cp index.html admin.html collection.html backtest-v2.html research-export.js research-export.css autonomous-research.js _site/
          cp data/dashboard.json _site/data/
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
