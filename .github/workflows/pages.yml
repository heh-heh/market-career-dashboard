name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "admin.html"
      - "admin-login.js"
      - "dashboard-config.js"
      - "scripts/configure_dashboard_api.py"
      - "data/dashboard.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble public UI only
        run: |
          mkdir -p _site/data
          cp index.html admin.html admin-login.js dashboard-config.js _site/
          cp data/dashboard.json _site/data/
          touch _site/.nojekyll
      - name: Verify configured home-server HTTPS API
        if: ${{ vars.DASHBOARD_API_BASE_URL != '' }}
        env:
          DASHBOARD_API_BASE_URL: ${{ vars.DASHBOARD_API_BASE_URL }}
        run: python3 scripts/configure_dashboard_api.py --url "$DASHBOARD_API_BASE_URL" --out _site/dashboard-config.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
