# Legacy dashboard Pages: manual fallback only while public hosting moves home.
# The separate profile repo (heh-heh/heh-heh) is unaffected.
name: Deploy GitHub Pages (legacy/manual)
on:
  workflow_dispatch:
concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble public UI only
        run: |
          mkdir -p _site/data
          cp index.html admin.html admin-login.js server-status.html server-status.js server-metrics.js server-metrics.css dashboard-config.js _site/
          cp data/dashboard.json _site/data/
          touch _site/.nojekyll
      - name: Validate linked public server status page
        run: |
          test -s _site/index.html
          test -s _site/server-status.html
          test -s _site/server-status.js
          test -s _site/server-metrics.js
          test -s _site/server-metrics.css
          grep -Fq 'href="./server-status.html"' _site/index.html
          grep -Fq 'href="./"' _site/server-status.html
      - name: Verify configured home-server HTTPS API
        if: ${{ vars.DASHBOARD_API_BASE_URL != '' }}
        env:
          DASHBOARD_API_BASE_URL: ${{ vars.DASHBOARD_API_BASE_URL }}
        run: python3 scripts/configure_dashboard_api.py --url "$DASHBOARD_API_BASE_URL" --out _site/dashboard-config.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
