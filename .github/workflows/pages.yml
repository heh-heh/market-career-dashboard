name: Deploy GitHub Pages
# Only strategy-engine-v3 publishes the current V0.8 UI; legacy main cannot overwrite it.
on:
  push:
    branches: ["strategy-engine-v3"]
    paths:
      - "index.html"
      - "admin.html"
      - "v08-web.js"
      - "v081-web.js"
      - "collection.html"
      - "backtest-v2.html"
      - "research-export.js"
      - "research-export.css"
      - "autonomous-research.js"
      - "data/dashboard.json"
      - ".github/workflows/pages.yml"
concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify V0.7 UI before publishing
        run: |
          test "$GITHUB_REF" = "refs/heads/strategy-engine-v3"
          node research/test_admin_navigation_smoke.cjs
          node research/test_v07_dashboard_smoke.cjs
          node research/test_v08_web_smoke.cjs
          node research/test_v081_web_smoke.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble public UI only
        run: |
          mkdir -p _site/data
          cp index.html admin.html collection.html backtest-v2.html research-export.js research-export.css autonomous-research.js v08-web.js v081-web.js _site/
          cp data/dashboard.json _site/data/
          touch _site/.nojekyll
          printf '{"branch":"%s","commit":"%s","run_id":"%s"}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" > _site/deployment.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
