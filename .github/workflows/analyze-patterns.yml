name: Analyze 3m trading patterns

on:
  workflow_dispatch:
  push:
    paths:
      - "pattern_engine.py"
      - "scripts/analyze_patterns.py"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pattern analysis
        run: python scripts/analyze_patterns.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pattern-analysis-report
          path: pattern_analysis_report.json
          retention-days: 7
