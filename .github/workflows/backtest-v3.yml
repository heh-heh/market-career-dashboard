name: Backtest V3
on:
  push:
    paths:
      - "research/backtest_v3.py"
      - ".github/workflows/backtest-v3.yml"
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - run: python research/backtest_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-v3-result
          path: research/backtest_v3_result.json
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/backtest_v3_result.json
          git diff --cached --quiet || git commit -m "research: update V3 backtest result"
          git push
